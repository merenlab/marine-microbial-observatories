name: Propose a new time-series program
description: Suggest a repeat-sampling time-series that generates omics data
title: "Add: "
labels: ["new record"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for sustained repeat sampling at a fixed location. For a single expedition,
        use the expedition form. For networks coordinating omics ocean observing, use
        the coordination form.

        We thank you for contribution in advance. Please note that **nothing below is 'required'
        except the name of the program and your name**, but we hope you will try to fill in
        anything you can so when we try to turn your suggestion into a YAML record we will have
        enough information to work with without needing to reach out to you with questions.

        Before a record can be published it needs a **status**, the **countries** and
        **ocean basins**, the **start year**, the **sampling depth**, the **sampling cadence**
        and at least one **contact**, so those are the most useful things to fill in.

        You do not need to know YAML, git, or anything about GitHub beyond this form.

  - type: input
    id: name
    attributes:
      label: Full program name
      description: Spelled out in full; the short name goes in the next field.
      placeholder: FRAM Molecular Observatory
    validations:
      required: true

  - type: input
    id: acronym
    attributes:
      label: Acronym
      description: The short name the program is usually known by.
      placeholder: FRAM

  - type: input
    id: website
    attributes:
      label: Program website
      description: The main landing page for the program.
      placeholder: https://www.awi.de/en/science/research-infrastructure/observatories/ocean-fram.html

  - type: textarea
    id: additional-websites
    attributes:
      label: Additional websites
      description: >
        Other pages that document the same program (a data portal, an LTER site page, …),
        one URL per line.

  - type: input
    id: institutions
    attributes:
      label: Affiliated institution(s)
      description: Institutions and programs that run or fund the program. Free text; commas are fine.
      placeholder: Alfred Wegener Institute Helmholtz Centre for Polar and Marine Research

  - type: textarea
    id: institution-websites
    attributes:
      label: Websites of the affiliated institutions
      description: One URL per line, in the same order as the institutions above where possible.
      placeholder: |
        https://www.awi.de/en/

  - type: input
    id: countries
    attributes:
      label: Countries
      description: >
        The country or countries operating the program. Separate with commas if there is
        more than one.
      placeholder: Germany

  - type: dropdown
    id: status
    attributes:
      label: Observatory status
      description: >
        Choose "Active, but omics discontinued" when the observatory still samples but no
        longer collects material for sequencing. If you need more options here, pldease contact us.
      options:
        - Active
        - Active, but omics discontinued
        - Discontinued
        - Unknown

  - type: input
    id: coordinates
    attributes:
      label: Coordinates
      description: >
        Latitude and longitude in decimal degrees (south and west are negative). If the
        program has several stations, give a central or flagship one.
      placeholder: 79.023, 4.2618

  - type: dropdown
    id: ocean-basins
    attributes:
      label: Ocean basin(s)
      description: >
        The ocean basin(s) or regional sea(s) the sampling sites fall in. Multiple options
        can be selected. If none fits, choose "Other" and name it in the next field.
      multiple: true
      options:
        - Arctic Ocean
        - Southern Ocean
        - North Atlantic Ocean
        - Northeast Atlantic Ocean
        - Northwest Atlantic Ocean
        - South Atlantic Ocean
        - North Pacific Ocean
        - Northeast Pacific Ocean
        - Northwest Pacific Ocean
        - South Pacific Ocean
        - Indian Ocean
        - Mediterranean Sea
        - Baltic Sea
        - North Sea
        - English Channel
        - Biscay Bay
        - Sargasso Sea
        - Caribbean Sea
        - Arabian Sea
        - Bay of Bengal
        - Other (name it in the next field)

  - type: input
    id: sub-region
    attributes:
      label: Sub-region
      description: >
        A more specific location: a bay, strait, shelf, transect or named station area.
      placeholder: Fram Strait

  - type: input
    id: years
    attributes:
      label: Sampling years
      description: >
        When the time series started (any kind of sampling, not only omics), and when it
        ended or "present" if it is ongoing.
      placeholder: 2014 – present

  - type: input
    id: dna-year
    attributes:
      label: Year DNA/omics collection started
      description: >
        The first year samples were collected for sequencing. Leave blank if it is the same
        as the sampling start year. If collection began in stages, describe it briefly
        (e.g. "2000: benthic and sediment traps; 2009: water column for 18S").
      placeholder: "2014"

  - type: dropdown
    id: omics
    attributes:
      label: Types of omics produced
      description: Multiple options can be selected.
      multiple: true
      options:
        - Amplicon sequencing
        - Metagenomics
        - Metatranscriptomics
        - Other omics (proteomics, metabolomics, …)

  - type: dropdown
    id: cadence
    attributes:
      label: Sampling cadence for omics
      description: >
        How often omics samples are taken, at the frequency most representative of the
        program. If it varies (e.g. weekly in spring, monthly otherwise), pick the typical
        one and explain under "Anything else".
      options:
        - Weekly or more often
        - Monthly
        - Bimonthly
        - Quarterly
        - Annually

  - type: dropdown
    id: depth
    attributes:
      label: Sampling depth for omics
      options:
        - Surface only (shallower than 100 m)
        - Surface and deep (also below 100 m)

  - type: dropdown
    id: multiple-sites
    attributes:
      label: Multiple sampling sites
      description: Does the program sample more than one station?
      options:
        - "Yes"
        - "No"

  - type: textarea
    id: sites-details
    attributes:
      label: Information about multiple sampling sites
      description: >
        The station layout: transects, depth gradients, moorings. Leave blank if there is
        one sampling site.
      placeholder: >-
        Multiple stations across Atlantic and Arctic water masses, including benthic depth
        gradient. One transect along ~79°N from ~11°E to 5°W, one transect along ~4°E from
        78.5°N to 80°N.

  - type: textarea
    id: accessions
    attributes:
      label: Data accessions
      description: >
        BioProject, ENA, DDBJ, SRA, PRIDE or GenBank accessions, one per line. Bare
        accessions please — no archive names or URLs. Anything about data availability
        that is not an accession (for example "2020 onwards not yet submitted") can go on a
        line of its own after them.
      placeholder: |
        PRJEB43905
        PRJEB67368

  - type: textarea
    id: contacts
    attributes:
      label: Contacts
      description: >
        One person per line, as `Name <email> (role)`. A name without an email is fine if
        you don't know the address. These addresses will be published on the website, so
        please only list people who are willing to be contacted.
      placeholder: |
        Katja Metfies <katja.metfies@awi.de> (PI)
        Christina Bienhold <christina.bienhold@awi.de> (PI)

  - type: textarea
    id: publications
    attributes:
      label: Example publications
      description: >
        Preferably ones that use the program's omics data. One per line, as a bare DOI
        where one exists (`10.…`, no `https://doi.org/`); a URL is fine for items without
        a DOI.
      placeholder: |
        10.1038/s41467-025-56203-3

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: >
        Sampling design, related programs, caveats — anything a newcomer to this program
        would want to know.
      placeholder: >-
        Annual and continuous sampling in the water column and at the deep seafloor. FRAM
        is an expansion of LTER Hausgarten.

  - type: input
    id: your-name
    attributes:
      label: Your name
      description: >
        Recorded as the person who verified this record, with today's date.
    validations:
      required: true
