name: Propose a new omics observing coordination program
description: Suggest a network for omics observing coordination to be added to the marine microbial observatories registry.
title: "Add: "
labels: ["new record"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for bodies that coordinate omics observing rather than for individual
        observatories or sampling sites. Those go through the observatory or expedition form instead.

        We thank you for contribution in advance. Please note that **nothing below is 'required'
        except the name of the program and your name**, but we hope you will try to fill in
        anything you can so when we try to turn your suggestion into a YAML record we will have
        enough information to work with without needing to reach out to you with questions.

        Every record needs a **status**, a **geographic scope** and a **mission statement**
        before it can be published, so those are the most useful things to fill in.

        You do not need to know YAML, git, or anything about GitHub beyond this form.

  - type: input
    id: name
    attributes:
      label: Full program name
      description: Spelled out in full; the short name goes in the next field.
      placeholder: Ocean Biomolecular Observing Network
    validations:
      required: true

  - type: input
    id: acronym
    attributes:
      label: Acronym
      description: >
        The short name the network is usually known by. If it goes by two, give both
        separated by ` / `.
      placeholder: OBON
    validations:
      required: false

  - type: input
    id: website
    attributes:
      label: Network website
      description: The main landing page for the network.
      placeholder: http://obon-ocean.org
    validations:
      required: false

  - type: textarea
    id: additional-websites
    attributes:
      label: Additional websites
      description: >
        Other pages that document the same network (a project page at a host institution,
        an Ocean Decade listing, …), one URL per line.
      placeholder: |
        https://oceandecade.org/actions/ocean-biomolecular-observing-network/
    validations:
      required: false

  - type: input
    id: institutions
    attributes:
      label: Affiliated institution(s)
      description: Member or partner institutions and programs. Free text; commas are fine.
      placeholder: Partnership for Observation of the Global Ocean (POGO), Scripps Institution of Oceanography (SIO), Monterey Bay Aquarium Research Institute (MBARI), National Oceanography Center (NOC), Commonwealth Scientific and Industrial Research Organisation (CSIRO)
    validations:
      required: false

  - type: input
    id: umbrella
    attributes:
      label: Umbrella organisation
      description: >
        The larger body the network sits under, if any — for example UN Ocean Decade,
        OBON, GOOS or MBON.
      placeholder: UN Ocean Decade
    validations:
      required: false

  - type: dropdown
    id: status
    attributes:
      label: Status
      description: >
        Is the network still operating? A network that has been announced but is still
        forming counts as **Active**; say so in the establishment year field below. A
        dormant or concluded network counts as **Discontinued**.
      options:
        - Active
        - Discontinued
        - Unknown
    validations:
      required: false

  - type: input
    id: date
    attributes:
      label: Year of establishment
      description: >
        The year the network was established. If it was announced or initiated before it
        began operating, add a word saying so (e.g. "2023, initiated"). If the network has
        concluded, mention when under "Anything else".
      placeholder: "2021"
    validations:
      required: false

  - type: input
    id: scope
    attributes:
      label: Geographic scope
      description: >
        The region the network covers: `Global`, an ocean basin, a country, or a described
        area. Examples from the catalogue: "Global", "Europe / North-East Atlantic and
        adjacent seas", "Gulf of Mexico", "Antarctica and the Southern Ocean - circumpolar".
      placeholder: Global
    validations:
      required: false

  - type: textarea
    id: mission
    attributes:
      label: Mission statement
      description: >
        One or two sentences on what the network is for, ideally in the network's own words
        (copying from its website is fine).
      placeholder: >-
        The programme will transform how we sense, harvest, protect, and manage ocean life,
        which faces multiple stresses including pollution, habitat loss, and climate change.
    validations:
      required: false

  - type: textarea
    id: accessions
    attributes:
      label: Data accessions
      description: >
        Most networks hold data through their member programs, so leave this blank unless
        the network itself has archived data. If it does: BioProject, ENA, DDBJ, SRA, PRIDE
        or GenBank accessions, one per line. Bare accessions please: no archive names or
        URLs. Anything about data availability that is not an accession (a data portal,
        "coming soon", etc) can go on a line of its own after them.
      placeholder: |
        PRJNA...
    validations:
      required: false

  - type: textarea
    id: contacts
    attributes:
      label: Contacts
      description: >
        One person per line, as `Name <email> (role)`. A name without an email is fine if
        you don't know the address. These addresses will be published on the website, so
        please only list people who are willing to be contacted.
      placeholder: |
        Margaret Leinen <mleinen@ucsd.edu> (Lead)
    validations:
      required: false

  - type: textarea
    id: publications
    attributes:
      label: Example publications
      description: >
        Publications or governance documents describing the network, preferably ones that
        show coordination of omics observing. One per line, as a bare DOI where one exists
        (`10.…`, no `https://doi.org/`); a URL is fine for items without a DOI.
      placeholder: |
        10.4031/MTSJ.56.3.20
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: >
        Anything else we should know about this network: which programs it brings together,
        the kinds of omics data its members produce, when it concluded, related networks.
    validations:
      required: false

  - type: input
    id: your-name
    attributes:
      label: Your name
      description: >
        Recorded as the person who verified this record, with today's date.
    validations:
      required: true
