name: Propose a new expedition
description: Suggest an expedition to be added to the marine microbial observatories registry.
title: "Add: "
labels: ["new record"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for discrete expeditions. For a time-series, use the
        observatory form. For a body that coordinates omics observing across sites,
        use the network form.


        We thank you for contribution in advance. Please note that **nothing below is 'required'
        except the name of the program and your name**, but we hope you will try to fill in
        anything you can so when we try to turn your suggestion into a YAML record we will have
        enough information to work with without needing to reach out to you with questions.

        Every record needs at least one **contact** before it can be published. Expeditions
        are drawn on the map sample by sample, so knowing **where the per-sample metadata
        lives** (coordinates and depths) is the other especially useful thing to tell us.

        You do not need to know YAML, git, or anything about GitHub beyond this form.

  - type: input
    id: name
    attributes:
      label: Full program name
      description: Spelled out in full; the short name goes in the next field.
      placeholder: Antarctic Circumnavigation Expedition
    validations:
      required: true

  - type: input
    id: acronym
    attributes:
      label: Acronym
      description: The short name the expedition is usually known by.
      placeholder: ACE

  - type: input
    id: website
    attributes:
      label: Program website
      description: The main landing page for the expedition.
      placeholder: https://www.datascience.ch/projects/ace-data

  - type: textarea
    id: additional-websites
    attributes:
      label: Additional websites
      description: >
        Other pages that document the same expedition (a data portal, a cruise report
        page, etc), one URL per line.

  - type: input
    id: institutions
    attributes:
      label: Affiliated institution(s)
      description: Institutions and programs that ran or funded the expedition. Free text; commas are fine.
      placeholder: Swiss Polar Institute (SPI), Université de Bretagne Occidentale

  - type: textarea
    id: institution-websites
    attributes:
      label: Websites of the affiliated institutions
      description: One URL per line, in the same order as the institutions above where possible.
      placeholder: |
        https://swisspolar.ch

  - type: textarea
    id: accessions
    attributes:
      label: Data accessions
      description: >
        Study-level accessions holding the molecular data for the expedition: BioProject, ENA,
        DDBJ, SRA, PRIDE or GenBank, one per line. Bare accessions please: no archive names
        or URLs. Anything about data availability that is not an accession (for example
        "PRJNA385736 covers only a subset of samples") can go on a line of its own after them.
      placeholder: |
        PRJEB83083

  - type: textarea
    id: sample-metadata
    attributes:
      label: Where is the per-sample metadata?
      description: >
        Where should people ultimately find each sample's BioSample accession, and metadata?
        A simple pointer is enough: an archive, a portal, a supplementary table. Mention any
        gaps, such as samples that are missing coordinates.
      placeholder: |
        Download from MGnify (PRJEB83083)
        or: https://metalog.embl.de/ (Study_Code: Sanchez_2024_marine_MALASPINA_vertical)
        or: Boulton et al. 2025, Table S1

  - type: textarea
    id: contacts
    attributes:
      label: Contacts
      description: >
        One person per line, as `Name <email> (role)`. A name without an email is fine if
        you don't know the address. These addresses will be published on the website, so
        please only list people who are willing to be contacted.
      placeholder: |
        Loïs Maignien <Lois.Maignien@univ-brest.fr> (PI ACE metagenomics)

  - type: textarea
    id: publications
    attributes:
      label: Example publications
      description: >
        Data papers are most useful. One per line, as a bare DOI where one exists
        (`10.xxxx/xxxx-xxx-xxxx-x`, no `https://doi.org/`); a URL is fine for items without a DOI.
      placeholder: |
        10.1038/s41467-026-69584-w
        10.5194/esd-12-1295-2021

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: >
        Cruise track, years, kinds of omics data produced, related programs, caveats. Please
        include anything a newcomer would want to know about this expedition. This is free
        text, so you can include links, tables, or whatever you like.

  - type: input
    id: your-name
    attributes:
      label: Your name
      description: >
        Recorded as the person who verified this record, with today's date.
    validations:
      required: true
