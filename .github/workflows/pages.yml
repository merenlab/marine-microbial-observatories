name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'site/**'
      - 'schema/**'
      - 'scripts/build.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never leave a half-finished deployment behind if two pushes land together.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # A broken record should never reach the published site.
      - name: Validate before publishing
        run: python3 scripts/validate.py

      - name: Build
        run: python3 scripts/build.py --built-on "$(date -u +%Y-%m-%d)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
