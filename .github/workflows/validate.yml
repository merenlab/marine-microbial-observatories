name: Validate records

on:
  pull_request:
    paths:
      - 'data/**'
      - 'schema/**'
      - 'scripts/**'
      - 'requirements.txt'
      # The build step below renders these into the site, so a pull request
      # that breaks one should fail here rather than at deploy time.
      - 'site/**'
      - 'ABOUT.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - '.github/workflows/validate.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate every record against its schema
        run: python3 scripts/validate.py

      - name: Confirm the site still builds
        run: python3 scripts/build.py --built-on "$(date -u +%Y-%m-%d)"

      - name: Summarise warnings
        if: always()
        run: |
          {
            echo '## Record validation'
            echo
            echo '```'
            # From the top, not the tail: the report is grouped by category with
            # errors first, so the head is the part worth reading. The cap is only
            # there to keep a pathological run from flooding the summary.
            python3 scripts/validate.py 2>&1 | head -n 250 || true
            echo '```'
            echo
            echo 'Warnings do not block this pull request. They mark records that are'
            echo 'incomplete or internally inconsistent, mostly inherited from the'
            echo 'original spreadsheets. Fixing them is welcome but never required.'
          } >> "$GITHUB_STEP_SUMMARY"
