id: nbdl
name: National Biodiversity DNA Library
acronym: NBDL
network-website: https://obon-ocean.org/project/national-biodiversity-dna-library-nbdl/
affiliated-institutions: |-
  Commonwealth Scientific and Industrial Research Organisation (CSIRO), Bioplatforms Australia, Minderoo Foundation
umbrella-organisation: OBON
status: active
established-year: 2022
geographic-scope: Australia
mission-statement: |-
  Australia’s National Biodiversity DNA Library (NBDL) will use cutting edge technology to create DNA reference sequences for Australia’s species from expertly identified specimens held in Australian natural history collections, and make these freely available via an online portal.
