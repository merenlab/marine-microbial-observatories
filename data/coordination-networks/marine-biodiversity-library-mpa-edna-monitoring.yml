id: marine-biodiversity-library-mpa-edna-monitoring
name: Marine Biodiversity Library & MPA eDNA monitoring
network-website: https://obon-ocean.org/project/marine-biodiversity-library-mpa-edna-monitoring/
affiliated-institutions: Fisheries and Oceans Canada (DFO), Hakai Institute, Tula Foundation,
  McGill University
umbrella-organisation: OBON
status: active
established-year: 2022
geographic-scope: Canada's Pacific and Atlantic regions
mission-statement: |-
  This project uses eDNA metabarcoding to establish baseline biodiversity and species distribution data across Marine Protected Areas and areas of interest in Canada's Pacific and Atlantic regions. It simultaneously builds a curated Canadian Marine DNA Library of high-quality reference sequences, pairing this resource with the biomonitoring surveys to accelerate eDNA's operational uptake for science-based advice and position Canada as a global leader in ocean conservation.
