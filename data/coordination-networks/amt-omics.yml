id: amt-omics
name: Atlantic Meridional Transect ‘omics network
acronym: AMT-omics
network-website: https://obon-ocean.org/project/amt-omics-atlantic-meridional-transect-omics-network/
additional-websites:
  - https://amt-uk.org
affiliated-institutions: |-
  Plymouth Marine Laboratory (PML), University of Southern California, St Francis Xavier University, The University of California (Irvine), the University of Stellenbosch and the Marine Biological Association of the UK
umbrella-organisation: OBON
status: active
established-year: 2024
geographic-scope: Atlantic
mission-statement: |-
  Building on the Atlantic Meridional Transect (AMT) programme's three decades of ocean observations, AMT-omics aims to make molecular data collected since 2009 openly accessible and integrate diverse omics datasets into a unique long-term time series spanning the Atlantic Ocean, enabling new insights into marine ecosystem change.
