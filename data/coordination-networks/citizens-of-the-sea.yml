id: citizens-of-the-sea
name: Citizens of the Sea
acronym: Citizens of the Sea
network-website: https://obon-ocean.org/project/citizens-of-the-sea/
additional-websites:
  - https://www.citizensofthesea.org/
affiliated-institutions: Citizens of the Sea, Cawthron Institute (CAWTHRON)
umbrella-organisation: OBON
status: active
established-year: 2024
geographic-scope: South Pacific
mission-statement: |-
  Our mission is to build a citizen-powered ocean observing network that generates large-scale, spatio-temporal biodiversity data from under-sampled offshore waters. By equipping cruising yachts and offshore racing teams with simple eDNA sampling kits, we transform voyages across the Pacific and the world's most remote oceans into scientific expeditions that expand our understanding of marine life.
