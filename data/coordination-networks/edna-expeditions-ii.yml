id: edna-expeditions-ii
name: Environmental DNA Expeditions in UNESCO World Heritage Marine Sites II
acronym: eDNA Expeditions II
network-website: https://www.unesco.org/en/edna-expeditions
affiliated-institutions: |-
  IOC UNESCO IODE (International Oceanographic Data and Information Exchange) Programme and Marine World Heritage Centre of UNESCO OBIS
umbrella-organisation: OBON
status: active
established-year: 2025
geographic-scope: Global
mission-statement: |-
  The “eDNA expeditions II” project is a citizen-science initiative designed to establish repeated eDNA sampling across marine protected areas. Education will be central to the initiative and will foster local ownership, and build technical capacity to monitor and protect marine biodiversity in the face of climate change.
