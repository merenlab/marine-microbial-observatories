mission-statement: |-
  NOAA Omics harnesses the power of this advanced technology to accelerate high-impact science, enhance decision making, and improve operational efficiency. NOAA Omics scientists, from across NOAA line-offices, including NOS, OAR, NEDIS, & NMFS drive innovation and integration of omics techniques - safeguarding marine resources, detecting threats, and reinforcing the United State’s leadership in ocean science and technology.
