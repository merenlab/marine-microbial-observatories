notes: |-
  Note: includes other data types (physical, chemical etc) but Julie is the main contact for microbial work. Collaborative with Coast Guard / Department of Fisheries and Oceans Canada; depths = 1, 5, 10, 60 m (more recently added 30 m); DNA was not size fractionated in 2014-2017 (0.2 um filters); then size fractionated in 2018-2021 (i.e. 3 and 0.2 um filters) and then non-size fractionated 2022 onwards; monthly transects for surface water samples at 5 stations since 2023; monthly samples since about 2016 for DNA/RNA extractions that are collected in a time fashion of 20 minutes from collection to LN2 freezing
