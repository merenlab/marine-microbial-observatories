id: kongsfjorden
name: Kongsfjorden Svalbard
acronym: KONGSFJORDEN
program-website: https://nyalesundresearch.no/research-and-monitoring__trashed/kongsfjorden-system/
affiliated-institutions: |-
  Interdisciplinary Centre for Marine and Environmental Research (CIIMAR); Norwegian Polar Institute (NPI); National Centre for Polar and Ocean Research (NCPOR, India); Lehigh University
affiliated-institution-websites:
  - https://nyalesundresearch.no
status: active
sampling-start-year: 1996
sampling-end-year: present
dna-collection-start-year: 2016
dna-collection-note: '2016: water column (surface: 15m and bottom: 300m) for 16S and 18S sequencing'
countries:
  - Norway
ocean-basins:
  - Arctic Ocean
sub-region: Svalbard fjord
latitude: 78.26
longitude: 15.53
multiple-sampling-sites: true
sampling-sites-note: |-
  Most of the data are concentrated at the KB3 station, although the dataset also includes samples collected along the Kongsfjorden transect, including stations KB1, KB4, and KB8. Data collected between 2016 and 2019 also include samples from Rijpfjorden, the coastal area of Rijpfjorden, Kongsfjorden, and the adjacent open ocean stations.
sampling-depth: surface-and-deep
sampling-cadence: weekly-or-more
omics-types:
  - amplicon-sequencing
  - metagenomics
