notes: |-
  Annual (2016–2018) and weekly (2019–present) water column sampling has been conducted at a minimum of 15 and 300 m, with additional depths sampled on some occasions. The 2016–2020 dataset also includes samples collected from Rijpfjorden, the coastal area of Rijpfjorden, Kongsfjorden, and the adjacent open ocean.
