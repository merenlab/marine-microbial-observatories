multiple-sampling-sites: false
sampling-sites-note: |-
  The CARIACO Ocean Time-Series conducted monthly sampling 1994-2017 at multiple depths from the surface to 1,380 m. The Cariaco basin is a permanently anoxic basin. Significant effort was conducted on sampling the microbial community composition, biomass and concentration, and productivity near the surface (phytoplankton, other microbes), across the oxic/anoxic interface, in the anoxic waters typically below 150-200 m through to the bottom of the basin. Selective sampling of the microbial community was also done in sediment trap samples, including some non-poisoned samples of the last cup in sediment traps, collected for 2 weeks every 6 months with traps anchored at 4 depths
sampling-depth: surface-and-deep
sampling-cadence: monthly
