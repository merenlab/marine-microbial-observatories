contacts:
  - name: Maxim Rubin-Blum
    email: mrubin@ocean.org.il
    role: PI
notes: |-
  Long-term depth-resolved microbial monitoring of the oligotrophic southeastern Mediterranean Sea. We conduct two seasonal cruises each year, sampling eight stations and multiple depths from the upper water column to ~1,700 m, yielding roughly 50 samples per cruise. We have conducted 16S rRNA gene V4 amplicon sequencing since 2018, and matching 18S rRNA gene V9 sequencing since 2022. The program captures both temporal variability and strong offshore/depth gradients from coastal and shelf waters to the deep Levantine Basin.
