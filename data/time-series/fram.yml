# Omics time-series program / observatory.
# Schema: ../../schema/time-series.schema.json
id: fram
name: FRAM Molecular Observatory
acronym: FRAM
program-website: https://www.awi.de/en/science/research-infrastructure/observatories/ocean-fram.html
affiliated-institutions: Alfred Wegener Institute Helmholtz Centre for Polar and Marine Research
affiliated-institution-websites:
  - https://www.awi.de/en/
status: active
sampling-start-year: 2014
sampling-end-year: present
dna-collection-note: |-
  Year-round water column sampling (moored RAS) for 16S / 18S sequencing; annual water column sampling (CTD) for 16S sequencing
countries:
  - Germany
ocean-basins:
  - Arctic Ocean
sub-region: Fram Strait
latitude: 79.023
longitude: 4.2618
multiple-sampling-sites: true
sampling-sites-note: |-
  Multiple stations across Atlantic and Arctic water masses, including benthic depth gradient. One transect along ~79°N from ~11°E to 5°W, one transect along ~4°E from 78.5°N to 80°N. Year-round water sampling in the photic zone via Remote Access Samplers at one station in Atlantic Water (West Spitsbergen Current, WSC) and one station in Polar Water (East Greenland Current, EGC). Year-round sampling of sinking particles via sediment traps in WSC and EGC. Traps and RAS are deployed on long-term moorings.
sampling-depth: surface-and-deep
sampling-cadence: weekly-or-more
omics-types:
  - amplicon-sequencing
  - metagenomics
data-accessions:
  - PRJEB43905
  - PRJEB67368
  - PRJEB52171
  - PRJEB82775
  - PRJEB43086
  - PRJEB43576
