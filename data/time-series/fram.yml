  - 10.1038/s41396-023-01461-6
  - 10.1016/j.dsr2.2026.105604
  - 10.1111/1462-2920.16568
  - 10.1038/s43247-024-01782-0
notes: |-
  Annual and continuous sampling in the water column and at the deep seafloor, visual observations, in situ experimental work. FRAM is an expansion of LTER Hausgarten.
