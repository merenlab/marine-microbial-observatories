data-accessions-note: |-
  PRJNA1227241 holds the Oxford Nanopore reads and assembled contigs from the stepped-sackhole brines of the 2023 ice floe, plus the adjacent ice-core melts used for co-assembly (Kanaan & Deming 2025). The cruise report lists further molecular samples (ice-core and brine meta-omics filters, viral concentrates, mixotrophy and RuBisCO filters) that are not covered by this accession. Non-molecular sea-ice, snow and ocean data from the cruise are archived at the Norwegian Polar Institute data centre, which also holds the cruise report.
sample-metadata-source: |-
  BioSample records under PRJNA1227241 (per-sample coordinates and depth). Positions and dates for the 2023 floe station are tabulated in the cruise report (Table 1.1 and Table 9.2, CTD stations 87-108); the brine sampling site is given in Kanaan & Deming 2025 as 81.0489 N, 10.4783 E (21 May 2023).
