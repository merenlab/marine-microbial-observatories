notes: |-
  BREATHE is a Research Council of Norway project hosted at UiT, with partners in Norway, Denmark and Canada, studying sea-ice microbiology and biogeochemistry, in particular respiration and nutrient exchange at the bottom of sea ice. The molecular data catalogued here come from the BREATHE 2023 field-school cruise (IMR cruise ID 2023007008, cruise code BR7008) on RV Kronprins Haakon, Tromsø to Longyearbyen, 11-30 May 2023. The ship stayed moored to a single drifting floe on the Yermak Plateau north of Svalbard (about 81 N, 10-11 E) from 17 to 27 May 2023, working through three 3-day cycles of snow, sea-ice (cores and sackholes), under-ice water and CTD/rosette sampling. Three further CTD casts were made on 28 May at ADBO stations V6, V10 and KB3 on the return transit. Other BREATHE campaigns (for example Cambridge Bay 2022 and AO-2022) have non-molecular data only and are not part of this record.
